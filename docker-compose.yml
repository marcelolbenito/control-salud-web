# Control Salud — Docker Compose
# Finales de línea: LF (Unix). En Windows, Git debe respetar .gitattributes para no subir CRLF.
#
# Puertos publicados (host → contenedor) se pueden sobreescribir con .env en la raíz:
#   CONTROL_SALUD_WEB_PUBLISH=127.0.0.1:8082:80     # servidor detrás de Nginx (evita choque con 8080)
#   CONTROL_SALUD_MYSQL_PUBLISH=127.0.0.1:3307:3306
#   CONTROL_SALUD_PMA_PUBLISH=127.0.0.1:8083:80     # si 8081 está ocupado
# Valores por defecto pensados para desarrollo local.

services:
  mysql:
    image: mysql:8.0
    container_name: control-salud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-salud_root_dev}
      MYSQL_DATABASE: control_salud
    ports:
      - "${CONTROL_SALUD_MYSQL_PUBLISH:-3307:3306}"
    volumes:
      - control_salud_mysql_data:/var/lib/mysql
      - ./sql/schema_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  webapp:
    build:
      context: ./docker/web
      dockerfile: Dockerfile
    container_name: control-salud-web
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    volumes:
      - ./web:/var/www
      - ./Laboratorio:/var/www/laboratorio
    ports:
      - "${CONTROL_SALUD_WEB_PUBLISH:-8080:80}"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: control-salud-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-salud_root_dev}
    ports:
      - "${CONTROL_SALUD_PMA_PUBLISH:-8081:80}"

  # WhatsApp WAHA — OPCIONAL (profile waha). Por defecto NO se levanta con "docker compose up".
  # Activar: docker compose --profile waha up -d  |  Apagar: docker stop control-salud-waha
  # Requiere config.local.php whatsapp_web.enabled=true y recordatorios.modo=whatsapp_web en MySQL.
  # Sin WAHA: recordatorios en modo manual (wa.me) — ver web/config/config.example.php
  waha:
    # NOWEB evita bug WEBJS "Cannot read properties of undefined (reading 'Cmd')" al vincular QR.
    image: devlikeapro/waha:latest
    container_name: control-salud-waha
    restart: unless-stopped
    profiles: ["waha"]
    depends_on:
      - webapp
    ports:
      - "${CONTROL_SALUD_WAHA_PUBLISH:-3000:3000}"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-dev_waha_local_key}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_URL:-http://webapp/recordatorios_webhook.php?api_key=dev_waha_local_key}
      WHATSAPP_HOOK_EVENTS: message
    volumes:
      - control_salud_waha_sessions:/app/.sessions

volumes:
  control_salud_mysql_data:
  control_salud_waha_sessions:
