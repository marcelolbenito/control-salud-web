# =============================================================================
# Control Salud — Laboratorio en Nginx (producción)
# =============================================================================
# Copiar el bloque elegido dentro del server {} de clinica.gesis2.com
# (o el vhost que use), ANTES de location / genérico que mande todo a index.php.
#
# Ajustar:
#   RUTA_LAB   → carpeta Laboratorio/public en el servidor
#   RUTA_WEB   → DocumentRoot (contenido de web/public)
#   PHP_FPM    → socket o upstream de PHP-FPM del host
#
# Ejemplo layout (como en local, pero con Nginx):
#   /var/www/php8/clinica/
#     Laboratorio/          ← módulo completo (vendor, .env, api, src)
#       public/index.php
#     public/               ← DocumentRoot
#       laboratorio/        ← puente (solo si usa Opción B)
#       index.php           ← Control Salud Web
#
# Probar:  nginx -t && systemctl reload nginx
# =============================================================================

# --- Valores típicos (editar) ---
# RUTA_LAB=/var/www/php8/clinica/Laboratorio/public
# RUTA_WEB=/var/www/php8/clinica/public
# PHP_FPM=unix:/run/php/php8.2-fpm.sock


# =============================================================================
# OPCIÓN A — RECOMENDADA (igual que Docker / Apache local)
# Sirve directo desde Laboratorio/public. No hace falta el puente para rutas.
# En Laboratorio/.env: APP_BASE_PATH=/laboratorio
#                      LAB_QUERY_ROUTER=false   (o borrar la variable)
# =============================================================================

location = /laboratorio {
    return 301 /laboratorio/;
}

location ^~ /laboratorio/assets/ {
    alias /var/www/php8/clinica/Laboratorio/public/assets/;
    expires 7d;
    access_log off;
}

location ^~ /laboratorio/ {
    alias /var/www/php8/clinica/Laboratorio/public/;
    index index.php;

    try_files $uri $uri/ @lab_fallback;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}

location @lab_fallback {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/php8/clinica/Laboratorio/public/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
}


# =============================================================================
